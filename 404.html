  <!-- Script d'installation PWA et détection mode autonome -->
  <script>
    window.deferredPWAInstallPrompt = null;
    window.isPWAInstalled = false;

    function checkIsAppInstalled() {
      return window.matchMedia('(display-mode: standalone)').matches ||
             window.navigator.standalone === true ||
             document.referrer.includes('android-app://') ||
             window.isPWAInstalled === true;
    }

    window.isAppInstalled = checkIsAppInstalled;

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      window.deferredPWAInstallPrompt = e;
      console.log('PWA installation disponible !');
    });

    window.addEventListener('appinstalled', (evt) => {
      window.isPWAInstalled = true;
      window.deferredPWAInstallPrompt = null;
      console.log('Application GREAT MINDS installée avec succès !');
      window.dispatchEvent(new CustomEvent('pwa-installed'));
    });

    window.triggerPWAInstall = function() {
      if (window.deferredPWAInstallPrompt) {
        window.deferredPWAInstallPrompt.prompt();
        window.deferredPWAInstallPrompt.userChoice.then((choiceResult) => {
          if (choiceResult.outcome === 'accepted') {
            window.isPWAInstalled = true;
            window.dispatchEvent(new CustomEvent('pwa-installed'));
          }
          window.deferredPWAInstallPrompt = null;
        });
        return true;
      }
      return false;
    };
  </script>
